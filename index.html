<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeCi — 本地优先的 AI 对话客户端 + Agent 工作台</title>
    <meta
      name="description"
      content="WeCi 是一个简洁、现代、开源、本地优先的 AI 对话客户端与 Agent 工作台：安静地聊天，或让 AI 自主调用工具完成任务。无账号、无数据库，数据留在本地。"
    />
    <meta name="theme-color" content="#0b0f14" />
    <meta property="og:title" content="WeCi — 本地优先的 AI 对话客户端 + Agent 工作台" />
    <meta
      property="og:description"
      content="开源、本地优先的 AI 对话客户端与 Agent 工作台。支持插件、MCP、多 Provider、权限控制。"
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b82f6'/%3E%3Ctext x='16' y='22' font-size='16' font-family='monospace' text-anchor='middle' fill='white'%3EW%3C/text%3E%3C/svg%3E" />
    <script>
      // 首屏前应用主题，避免闪烁
      try {
        const saved = localStorage.getItem('weci-web-theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
